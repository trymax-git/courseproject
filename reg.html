<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Регистрация в интернет-магазине SAASUNG. Создайте аккаунт для доступа к персональным предложениям и быстрым заказам."
    />
    <title>Регистрация - SAASUNG</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/main_page.css" />
    <link rel="stylesheet" href="styles/sign_in_style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto"
      rel="stylesheet"
      type="text/css"
    />
    <script src="js/components-loader.js" defer></script>
    <script src="js/mobile-menu.js" defer></script>
  </head>

  <body>
    <a href="#main-content" class="skip-link"
      >Перейти к основному содержимому</a
    >
    <div data-component="header"></div>

    <main id="main-content">
      <div class="sign_in_content">
        <div class="sign_in_entry">
          <h1>Регистрация</h1>
          <form action="#" method="post" aria-label="Форма регистрации">
            <input
              type="email"
              placeholder="E-Mail или Номер телефона"
              aria-label="Email или номер телефона"
              required
            />
            <input
              type="password"
              placeholder="Пароль"
              aria-label="Пароль"
              required
            />
            <button type="submit" class="button_entry">
              Зарегистрироваться
            </button>
          </form>
          <p>
            Нажимая на кнопку "Зарегистрироваться" вы соглашаетесь с
            <a href="#">политикой конфиденциальности</a>
          </p>
        </div>
      </div>
    </main>

    <div data-component="footer"></div>
  </body>
</html>
